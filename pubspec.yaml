name: pfa_pharmacy_invoice_tracker
description: "PFA Pharmacy Invoice Tracker: offline supplier invoice keeper for Windows — accounts payable, receipts, CSV export, ZIP backup, self-update."
publish_to: "none"
version: 1.2.10+11

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.7
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4
  file_selector: ^1.0.3
  archive: ^3.6.1
  excel: ^4.0.6
  pdf: ^3.11.0
  printing: ^5.13.0
  intl: ^0.19.0
  http: ^1.2.0
  package_info_plus: ^8.0.0
  window_manager: ^0.4.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
